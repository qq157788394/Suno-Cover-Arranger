[package]
name = "dashi-shell"
version = "2.3.0"
description = "《大师来了》渐进式客户端壳 (Tauri 薄壳)"
authors = ["dashi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde_json = "1"
# 仅用于本地引擎的 http://127.0.0.1 调用（纯 HTTP，无需 TLS 后端），
# 替代原 curl 子进程转发，并支持 multipart 直发（ADR-6）。
# stream：热更新下载大体积引擎包时分块落盘，避免整包驻留内存。
reqwest = { version = "0.13", features = ["multipart", "stream", "json"] }
# 热更新引擎包校验（sha256）与解压（zip），均为纯 Rust 实现、无系统依赖。
sha2 = "0.10"
zip = "2"
# Suno 试听缓存：mango/rights 返回的 wrapped key/iv 为 base64，解码用。
base64 = "0.22"
# Suno 试听缓存解密（M2）：SHA256(glt) 作 AES-256-GCM 解包 wrapped key/iv，
# 再以 AES-256-CTR 解密 m4a。全程纯 Rust，无系统/openssl 依赖。
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"

[dev-dependencies]
# 仅用于测试运行时；网络冒烟测试会真实请求 Suno（正常不跑，见 suno_probe.rs 内注释）。
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
