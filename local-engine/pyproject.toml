[project]
name = "suno-local-engine"
version = "0.1.0"
description = "大师扒谱本地 Python 引擎：lv-chordia 和弦 + madmom 调性/BPM/节奏 + chord-romanizer 级数"
# madmom 需源码编译（Cython），且 Python 3.13 上其依赖链/编译有风险，故上限锁 3.12。
# madmom 自带 numpy/Cython 实现的神经网络，**不依赖 TensorFlow**。
# 运行时由构建脚本用 python-build-standalone 3.12 + pip install --target 生成自包含 runtime。
# 注意：实际依赖以 requirements.txt 为准（构建脚本唯一读取来源），本文件仅作元数据/开发参考。
requires-python = ">=3.10,<3.13"
